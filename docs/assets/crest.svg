<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="crestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#0d2552" />
      <stop offset="100%" stop-color="#0b1b3d" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Shield Outline -->
  <path d="M100 15 L170 45 C170 120 100 180 100 185 C100 185 30 120 30 45 Z" 
        fill="url(#crestGrad)" stroke="url(#accentGrad)" stroke-width="4" filter="url(#glow)"/>

  <!-- Satellite Orbit Ellipse -->
  <ellipse cx="100" cy="100" rx="60" ry="24" transform="rotate(-30 100 100)" 
           fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.85"/>

  <!-- Satellite Body -->
  <g transform="translate(135, 65) rotate(15)">
    <!-- Central Cube -->
    <rect x="-10" y="-10" width="20" height="20" rx="3" fill="#ffffff" stroke="#0b1b3d" stroke-width="1.5"/>
    <!-- Solar Panels -->
    <rect x="-32" y="-6" width="20" height="12" rx="1.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1"/>
    <rect x="12" y="-6" width="20" height="12" rx="1.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1"/>
    <line x1="-22" y1="-6" x2="-22" y2="6" stroke="#0d2552" stroke-width="0.8"/>
    <line x1="22" y1="-6" x2="22" y2="6" stroke="#0d2552" stroke-width="0.8"/>
  </g>

  <!-- Stars / Telemetry Signals -->
  <circle cx="65" cy="80" r="2.5" fill="#38bdf8" />
  <circle cx="85" cy="55" r="2" fill="#ffffff" />
  <circle cx="140" cy="130" r="2" fill="#38bdf8" />
  <circle cx="60" cy="125" r="1.5" fill="#ffffff" />

  <!-- University / Mission Text Banner -->
  <text x="100" y="145" text-anchor="middle" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="900" font-size="14" letter-spacing="2">RVSAT-1</text>
  <text x="100" y="162" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-weight="600" font-size="8" letter-spacing="3">FLIGHT OPS</text>
</svg>

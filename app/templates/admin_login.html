{% extends "base.html" %}
{% block title %}Flight Director Login | ICARUS{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 4rem auto;">
    <div class="card" style="padding: 2.5rem; border: 1px solid var(--border-muted);">
        <div style="margin-bottom: 2rem;">
            <div class="eyebrow">[RESTRICTED ACCESS]</div>
            <h2 style="font-size: 1.4rem; color: var(--text-main); margin-top: 0.3rem;">Flight Director Console</h2>
            <p style="color: var(--text-muted); font-size: 0.82rem; margin-top: 0.25rem;">Competition administration & secret scoring oversight</p>
        </div>

        {% if error %}
        <div class="alert alert-warning" style="padding: 0.75rem 1rem; font-size: 0.82rem; margin-bottom: 1.25rem;">
            {{ error }}
        </div>
        {% endif %}

        <form action="/admin/login" method="POST">
            <div class="form-group">
                <label class="form-label">Flight Director Master Password</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required autofocus>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; margin-top: 0.75rem;">
                Authenticate Admin
            </button>
        </form>
    </div>
</div>
{% endblock %}
